name: Validate Atrezzo Website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:source
      - run: npm run build

      - name: Retain static build for inspection (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: wedding-phase04-static-build
          path: dist/
          retention-days: 7
